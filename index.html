<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Password Reset • Vanraj College</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1.25rem;
      color: var(--text);
    }

    .card {
      background: var(--card);
      width: 100%;
      max-width: 420px;
      padding: 2rem;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0,0,0,.08);
    }

    h1 {
      font-size: 1.35rem;
      font-weight: 700;
      margin-bottom: .25rem;
    }

    .sub {
      color: var(--muted);
      font-size: .875rem;
      margin-bottom: 1.75rem;
    }

    label {
      display: block;
      font-size: .8125rem;
      font-weight: 500;
      margin: 1rem 0 .4rem;
    }

    input {
      width: 100%;
      padding: .7rem .9rem;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: .95rem;
      transition: border-color .15s, box-shadow .15s;
    }

    input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37,99,235,.15);
    }

    button {
      width: 100%;
      margin-top: 1.75rem;
      padding: .8rem;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s;
    }

    button:hover { background: var(--primary-hover); }
    button:disabled {
      opacity: .65;
      cursor: not-allowed;
    }

    #result {
      display: none;
      margin-top: 1.25rem;
      padding: .85rem 1rem;
      border-radius: var(--radius);
      font-size: .875rem;
      line-height: 1.45;
    }

    .ok  { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
    .err { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }

    .note {
      margin-top: 1.5rem;
      padding: .85rem;
      background: #f8fafc;
      border-radius: 10px;
      font-size: .78rem;
      color: var(--muted);
      line-height: 1.5;
    }

    code {
      background: #e2e8f0;
      padding: .1rem .35rem;
      border-radius: 4px;
      font-size: .75rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Password Reset</h1>
    <p class="sub">Vanraj College Payment Portal</p>

    <label for="email">Email Address</label>
    <input id="email" type="email" placeholder="registered@email.com" autocomplete="email" required>

    <label for="token">Reset Token</label>
    <input id="token" type="text" placeholder="Email link se token" required>

    <label for="password">New Password</label>
    <input id="password" type="password" placeholder="Naya password (min 6)" autocomplete="new-password" required>

    <button id="btn" onclick="resetPassword()">Reset Password</button>

    <div id="result"></div>

    <div class="note">
      Token email ke reset link se aata hai:<br>
      <code>/password/reset/<b>yahan-wala-token</b></code>
    </div>
  </div>

  <script>
    const $ = id => document.getElementById(id);

    async function resetPassword() {
      const email    = $('email').value.trim();
      const token    = $('token').value.trim();
      const password = $('password').value.trim();
      const btn      = $('btn');
      const result   = $('result');

      if (!email || !token || !password) {
        return show(result, 'Sab fields bharna zaroori hai', false);
      }
      if (password.length < 6) {
        return show(result, 'Password kam se kam 6 characters ka hona chahiye', false);
      }

      btn.disabled = true;
      btn.textContent = 'Processing...';
      result.style.display = 'none';

      try {
        const res = await fetch('/api', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, token, password })
        });

        const data = await res.json();
        show(result, data.message, data.success);
      } catch (err) {
        show(result, 'Network error: ' + err.message, false);
      }

      btn.disabled = false;
      btn.textContent = 'Reset Password';
    }

    function show(el, msg, ok) {
      el.style.display = 'block';
      el.className = ok ? 'ok' : 'err';
      el.textContent = msg;
    }

    document.addEventListener('keydown', e => {
      if (e.key === 'Enter') resetPassword();
    });
  </script>
</body>
</html>
